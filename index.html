<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Comentários — Foto e Curtidas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <img id="top-photo" src="public/photo.jpg" alt="Foto do topo" />
      <h1>Galeria de Comentários</h1>
      <p class="hint">Comentários públicos abaixo. Curtidas armazenadas no repositório via função serverless.</p>
    </header>

    <section class="comments-section">
      <h2>Comentários</h2>
      <div id="comments" class="comments-list">
        <!-- Comentários serão inseridos aqui -->
      </div>
      <div class="new-comment">
        <input id="name" type="text" placeholder="Seu nome (opcional)" />
        <textarea id="comment" rows="3" placeholder="Escreva um comentário..."></textarea>
        <button id="btn-publish">Publicar comentário</button>
      </div>
      <div id="status" class="status"></div>
    </section>
  </main>

  <script src="scripts/app.js"></script>
</body>
</html>
